notes: >-
  全 7 册，2014 年 6 月中华书局出版，ISBN 978-7-101-10168-3；湖南省博物馆、复旦大学出土文献与古文字研究中心编纂，裘锡圭主编
  （据册 1 扫描本的 CIP 数据页和编纂委员会页）。2024 年 8 月出修订本，《老子》甲乙本由裘锡圭、刘娇修订增补（据刘钊文，《人民日报》2024-09-19）。
  影像取自 archive.org 条目 mawangdui 的册 1 扫描本"长沙马王堆汉墓简帛集成  1_13896076.pdf"
  （SHA-1 b60d38a83761478d2008d657706a31b44e4c50e5，与 archive.org 元数据一致；SHA-256 1e4e6686084b8367fda760ebfea64e04e125c2dc2f062aefe94d8974c5dce010），
  只抽整理图版中老子甲本（PDF 第 115–122 页）和老子乙本（PDF 第 162–169 页）共 16 页，JPEG 原样抽出。
  图版下方印有帛书行号，每页对应哪几章由 scripts/extract_plates.py 按行号和 tt24h 排版数据推出；第 122 页左端另有《五行》开头几行。
  同一条目里还有 1980 年文物出版社《马王堆汉墓帛书〔壹〕》扫描本，图版与本书重复，没有收。
