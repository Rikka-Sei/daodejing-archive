notes: >-
  原仓库 https://github.com/tt24h/daodejing ，本地代理访问 GitHub 返回 403，改从 archive.org 镜像取得：
  github仓库源码-daodejing--v0.1.3.zip（SHA-1 48669b210da5ff1adbac4c8842101faa17944d19，与 archive.org 元数据一致；
  SHA-256 f7ec8361d28949685716e761e69d59a6fa150a50c9c74b235407845dd6c31891）。取出 README、LICENSE-CC0，"工具/实录-*.txt"五份实录，
  "编译用代码/数据/"下的各本对齐表、尾注与概述（.typ），以及"编译用代码/代码/"下的共用通行字规则与造字码位表（.typ），以及补充字体 DaoDeJingExt-Light.ttf（SIL OFL 1.1，LICENSE-OFL）：页面用它显示造字序列与 Noto 里没有的生僻字。
  实录的底本：北大汉简为《北京大學藏西漢竹書》册2（2012），每行一简，行末〚L…〛为简号，"2背""124背"是"老子上經""老子下經"篇题；
  帛书甲乙本为《長沙馬王堆漢墓簡帛集成》修订本（2024），带帛书行号（乙本分上下半行）；
  郭店楚简为《楚地出土戰國簡册合集（一）郭店楚墓竹書》（2011），简号带甲乙丙；王弼本为浙江書局本，每章一行。
  记号："＝"重文号，"◍"分章圆点（marks 记为 section-mark），"□"缺字，"〼"多个连续的□（不计数量），〚F字〛残字，〚⿰…〛造字序列。
  对齐表（.typ）按王弼本分章，同一章里各本同列对齐；scripts/import_alignment.py 把它按底本顺序拼回去，逐字核对实录，结果放在 data/alignment/。
  北大汉简的释文由 scripts/import_tt24h.py 切分入库；帛书两本的章级释文来自维基文库，tt24h 的逐行释文放在 data/alignment/lines/；
  王弼本与校订本（tt24h 整理者的断句本）的章级释文由 import_alignment.py 生成。
  .typ 数据也用来把《简帛集成》图版页按行号挂到章（scripts/extract_plates.py）。
