notes: >-
  原仓库 https://github.com/tt24h/daodejing ，本地代理访问 GitHub 返回 403，改从 archive.org 镜像取得：
  github仓库源码-daodejing--v0.1.3.zip（SHA-1 48669b210da5ff1adbac4c8842101faa17944d19，与 archive.org 元数据一致；
  SHA-256 f7ec8361d28949685716e761e69d59a6fa150a50c9c74b235407845dd6c31891），只取出 README、"工具/实录-*.txt"三份释文和"编译用代码/数据/"下帛书甲乙本两份排版数据（.typ，用来查帛书每行属于哪一章）。
  北大汉简实录的底本是《北京大學藏西漢竹書》册2（2012），每行一简，行末〚L…〛为简号，"2背""124背"是"老子上經""老子下經"篇题；
  帛书甲乙本实录的底本是《長沙馬王堆漢墓簡帛集成》修订本（2024），带帛书行号（乙本分上下半行）。
  记号："＝"重文号，"◍"分章圆点（marks 记为 section-mark），"□"缺字，〚F字〛残字，〚⿰…〛造字序列，"〼"文件未说明，记为 other。
  目前只有北大本由 scripts/import_tt24h.py 切分入库；帛书两本已按章从维基文库入库，这里的逐行释文先只存原始文件；.typ 数据用于把《简帛集成》图版页按行号挂到章（scripts/extract_plates.py）。
