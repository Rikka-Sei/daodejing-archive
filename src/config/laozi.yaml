# 凡例的体例部分。释文是否经过复核、能否追溯到原始文件，由生成器按数据另行补在最后，不在这里写。
preface:
  - 本站汇录《老子》（《道德经》）的出土本、传世本与后人校订的本子，各本分别成篇，彼此不合并。侧栏可按“材料”或按“章节”查找：章节依王弼本分章。
  - 释文照录来源，不改字，不校勘：通假字、异体字、隶定字形和符号都保持原样，不依通行本改动。
  - 各本按来源的次第排列，不按通行本重排。竹简每枚一条，帛书每章一条；简号、章次照来源所给，如“2背”是第 2 简的背面。
  - “□”为残缺的字，“……”为缺文，均以灰色显示；灰色并带点线的，是来源标为存疑的字。括号里的字是整理者的读法，不是残缺。
  - “○”是来源无法录入的字形，其后括号内是整理者的读法；“＝”为重文号，“◍”为分章圆点，都照抄来源。
  - 点选图版缩略图可看原图。顶栏右侧可切换横排与竖排、影像与纯文；竖排自右向左。竹简与帛书各有阅读器，点字或拖选，可看到其他本在同一处写的什么。
  - 各本的出土情况、来源与授权，收在该本页面顶部的折叠栏里；侧栏目录每一项右侧的“⋯”可下载释文与数据。

